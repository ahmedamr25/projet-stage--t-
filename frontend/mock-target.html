<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intranet Tiznit - Portail d'Entreprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 50%, #1e1e38 0%, #0d0d15 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Arrière-plan animé */
    .bg-blobs {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(40px);
    }

    .blob-1 { top: -10%; left: -10%; animation: float 15s infinite alternate; }
    .blob-2 { bottom: -10%; right: -10%; animation: float 20s infinite alternate-reverse; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
      transition: all 0.3s ease;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 42px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.15);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

    /* Overlay Remplissage Automatique */
    .autofill-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 13, 21, 0.9);
      border-radius: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .autofill-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .autofill-text {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    /* Écran Success */
    .success-view {
      display: none;
    }

    .success-view.active {
      display: block;
    }

    .success-icon {
      color: var(--success);
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 50%;
      padding: 10px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    <!-- Vue Login -->
    <div id="login-card" class="card">
      
      <!-- Overlay SecurPass -->
      <div id="autofill-overlay" class="autofill-overlay">
        <div class="spinner"></div>
        <div class="autofill-text">Connexion via SecurPass...</div>
      </div>

      <div class="logo-icon">
        <i data-lucide="network"></i>
      </div>
      <h1>Portail Intranet</h1>
      <p class="subtitle">Accès sécurisé collaborateurs</p>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Identifiant / E-mail</label>
          <div class="input-wrapper">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="username" name="username" placeholder="ex: j.dupont@entreprise.com" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe réseau</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn">
          <span>Se connecter</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </form>
    </div>

    <!-- Vue Success -->
    <div id="success-card" class="card success-view">
      <div class="success-icon">
        <i data-lucide="check-circle2" style="width: 100%; height: 100%;"></i>
      </div>
      <h1>Accès Autorisé</h1>
      <p id="success-message" class="subtitle" style="margin-bottom: 25px;">Bienvenue sur l'intranet.</p>
      
      <div style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); text-align: left; font-size: 0.85rem; line-height: 1.5; color: var(--text-muted);">
        <p style="margin-bottom: 5px;"><strong style="color: var(--text);">Session active</strong></p>
        <p>• Type d'authentification : SecurPass DirectFill</p>
        <p>• Statut réseau : Connecté au Domaine</p>
      </div>

      <button id="btn-restart" class="btn" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text); margin-top: 25px;">
        <i data-lucide="refresh-cw"></i>
        <span>Retourner au portail</span>
      </button>
    </div>
  </div>

  <script>
    // Initialisation des icônes Lucide
    lucide.createIcons();

    const loginCard = document.getElementById('login-card');
    const successCard = document.getElementById('success-card');
    const autofillOverlay = document.getElementById('autofill-overlay');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('login-form');
    const successMessage = document.getElementById('success-message');
    const btnRestart = document.getElementById('btn-restart');

    // Gestion du submit
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      login(usernameInput.value);
    });

    btnRestart.addEventListener('click', () => {
      // Nettoyer hash et rafraîchir
      window.location.hash = '';
      usernameInput.value = '';
      passwordInput.value = '';
      successCard.classList.remove('active');
      loginCard.style.display = 'block';
    });

    // Fonction de connexion
    function login(username) {
      loginCard.style.pointerEvents = 'none';
      autofillOverlay.classList.add('active');
      
      setTimeout(() => {
        autofillOverlay.classList.remove('active');
        loginCard.style.display = 'none';
        loginCard.style.pointerEvents = 'auto';
        
        successMessage.innerHTML = `Bienvenue, <strong>${escapeHTML(username)}</strong>. Vous êtes connecté avec succès à l'intranet de Tiznit.`;
        successCard.classList.add('active');
      }, 1500);
    }

    // Détection des paramètres d'autofill dans le hash d'URL (Connexion Directe)
    function checkUrlHash() {
      const hash = window.location.hash.substring(1);
      if (!hash) return;

      const params = new URLSearchParams(hash);
      const isAutofill = params.get('autofill') === 'true';
      const user = params.get('user');
      const pass = params.get('pass');

      if (isAutofill && user && pass) {
        // Lancer la démo de connexion automatique
        autofillOverlay.classList.add('active');
        
        setTimeout(() => {
          usernameInput.value = decodeURIComponent(user);
          passwordInput.value = decodeURIComponent(pass);
          
          // Petit effet visuel pour simuler le submit après le remplissage
          setTimeout(() => {
            login(usernameInput.value);
          }, 1000);
        }, 800);
      }
    }

    // Échappement HTML sécurisé
    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    // Vérifier au chargement et si le hash change
    window.addEventListener('load', checkUrlHash);
    window.addEventListener('hashchange', checkUrlHash);
  </script>
</body>
</html>
